name: Feature request
description: Suggest an improvement or a new idea
title: "[idea] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Ideas welcome. Keep in mind the project stays a **single static `index.html`** with no build step or dependencies.
  - type: textarea
    id: problem
    attributes:
      label: What's the problem or itch?
      description: What's annoying or missing today?
      placeholder: I can't tell at a glance which PRs are waiting on me vs. on someone else…
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like to see?
      placeholder: A filter chip for "review requested from me"…
    validations:
      required: true
  - type: dropdown
    id: contribute
    attributes:
      label: Would you be up for a PR?
      options:
        - "Just an idea for now"
        - "Maybe, with some pointers"
        - "Yes, I'd like to build it"
    validations:
      required: false
